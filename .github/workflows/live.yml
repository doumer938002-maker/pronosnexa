name: Mise a jour live (cotes, non-partants, arrivees)
on:
  schedule:
    - cron: "*/5 6-22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/maj_live.py
      - name: Publier si change
        run: |
          git config user.name "pronosnexa-live"
          git config user.email "live@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || (git commit -m "live $(date -u +%H:%M)" && git pull --rebase -q && git push)
